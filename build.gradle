plugins {
    id 'java'
}

def versionProps = new Properties()
file("version.properties").withInputStream { versionProps.load(it) }

def vMajor = versionProps.getProperty("major", "1")
def vMinor = versionProps.getProperty("minor", "0")
def vPatch = versionProps.getProperty("patch", "0")
def vPrerelease = versionProps.getProperty("prerelease", "").trim()
def vBuild = versionProps.getProperty("build", "1").trim()
def vHotfix = versionProps.getProperty("hotfix", "").trim()
def vBeta = versionProps.getProperty("beta", "").trim()
def vDevMode = versionProps.getProperty("devmode", "0").trim()
def devSnapshot = vDevMode.equalsIgnoreCase("true") || vDevMode == "1"
ext.devSnapshot = devSnapshot

def computedVersion = "${vMajor}.${vMinor}.${vPatch}"
if (!vBeta.isEmpty()) {
    computedVersion += "-Beta.${vBeta}"
}
if (!vHotfix.isEmpty()) {
    computedVersion += "-Hotfix.${vHotfix}"
}
computedVersion += "-Build.${vBuild}"
if (!vPrerelease.isEmpty()) {
    computedVersion += "-${vPrerelease}"
}

version = computedVersion
ext.modFullVersion = computedVersion

println "[GatheringChunks] Version: ${computedVersion}"
println "[GatheringChunks] Development Snapshot: ${devSnapshot ? 'ENABLED' : 'disabled'}"

subprojects {
    apply plugin: 'java'
    group = 'com.ryvione'
    version = rootProject.version
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
        withJavadocJar()
    }
    sourcesJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
    repositories {
        mavenCentral()
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'BlameJared Maven (CrT / Bookshelf)'
            url = 'https://maven.blamejared.com'
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Progwml6 Maven (JEI)'
            url = 'https://dvs1.progwml6.com/files/maven/'
        }
    }
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }
}

task copyToReleases(type: Copy) {
    dependsOn ':Fabric:build', ':NeoForge:build'
    from files('Fabric/build/libs', 'NeoForge/build/libs')
    include "*.jar"
    exclude "*-sources.jar"
    exclude "*-javadoc.jar"
    into file("$rootDir/Releases")
    doLast {
        println "Copied jars to Releases/"
    }
}