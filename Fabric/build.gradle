plugins {
    id 'dev.architectury.loom' version '1.17.493'
    id 'maven-publish'
}

version = rootProject.version
group = rootProject.group
base {
    archivesName = "${mod_name}-Fabric-${minecraft_version}"
}

repositories {
    maven {
        name = "Terraformers SMC"
        url = "https://maven.terraformersmc.com/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-transfer-api-v1:${fabric_version}"

    // Common module
    implementation(project(path: ':Common', configuration: 'namedElements'))

    // ModMenu
    modImplementation "com.terraformersmc:modmenu:11.0.2"

    // JEI for Fabric
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // Annotations
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
}

loom {
    accessWidenerPath = file('src/main/resources/gatheringchunks.accesswidener')
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir project(':Common').file('src/main/resources')
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    from(project(':Common').sourceSets.main.resources) {
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'fabric.mod.json'
    }

    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    doLast {
        if (rootProject.ext.devSnapshot) {
            def marker = new File(destinationDir, "META-INF/${mod_id}/dev_snapshot")
            marker.parentFile.mkdirs()
            marker.text = "dev=true\nbuilt=${new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")}\n"
            println "[GatheringChunks] Embedded Development Snapshot marker in ${marker}"
        }
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('compileJava').configure {
    source(project(':Common').sourceSets.main.allSource)
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : archiveVersion.get(),
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion.get(),
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'              : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

remapJar {
    inputFile = jar.archiveFile
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}